[package]
name = "lite-vote"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "=0.4.0", features = ["font-fontsource", "tailwind", "ui"] }
unicode-segmentation = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
topcoat = { version = "=0.4.0", default-features = false, features = ["tailwind"] }
